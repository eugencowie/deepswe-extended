<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>deepswe-analysis</title>
    <!--
      Blocking pre-paint theme resolution to avoid a flash of the light theme.
      Duplicates the storage key and resolution logic of
      src/components/ui/theme-provider.tsx - keep the two in sync.
    -->
    <script>
      (() => {
        const stored = localStorage.getItem("vite-ui-theme");
        const theme = stored === "light" || stored === "dark" ? stored : "system";
        const resolved =
          theme === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : theme;
        document.documentElement.classList.add(resolved);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
