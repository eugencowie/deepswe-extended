catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vite-plus: 0.2.9

overrides:
  vite: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# `vp migrate` owns Vite+ and its Vite alias. Excluding them from bulk updates
# avoids pnpm writing a `catalog:` importer that frozen installs reject.
update:
  ignoreDeps:
    - vite
    - vite-plus
