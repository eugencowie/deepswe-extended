permissions:
  contents: read
  pages: write
  id-token: write

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: voidzero-dev/setup-vp@v1.17.0
        with: { cache: true }
      - uses: actions/configure-pages@v6
        id: configure
      - run: vp build --base "${{ steps.configure.outputs.base_path }}/"
      - uses: actions/upload-pages-artifact@v5
        with: { path: dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deploy
