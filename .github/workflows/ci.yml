permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: voidzero-dev/setup-vp@v1.17.0
        with: { cache: true }
      - run: vp run ready

  e2e:
    needs: ready
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: voidzero-dev/setup-vp@v1.17.0
        with: { cache: true }
      - run: vp run e2e:install
      - run: vp run e2e
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with: { name: playwright-report, path: playwright-report }

  pages:
    if: github.event_name == 'push'
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: voidzero-dev/setup-vp@v1.17.0
        with: { cache: true }
      - uses: actions/configure-pages@v6
        id: configure
      - run: vp build --base "${{ steps.configure.outputs.base_path }}/"
      - uses: actions/upload-pages-artifact@v5
        with: { path: dist }

  deploy:
    if: github.event_name == 'push'
    needs: pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deploy
