permissions:
  contents: read

on:
  schedule:
    - cron: "0 16 * * 5"
  workflow_dispatch:

jobs:
  refresh-deepswe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: voidzero-dev/setup-vp@v1.17.0
        with: { cache: true }
      - run: vp run refresh:deepswe
        id: refresh
      - uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.REFRESH_PR_TOKEN }}
          branch: refresh/deepswe
          add-paths: |
            data/deepswe-v1.1.json
            data/model-mapping.json
          commit-message: "Refresh DeepSWE snapshot"
          title: "chore(deps): Refresh DeepSWE snapshot"
          labels: chore
          body: >
            Automated weekly refresh of `data/deepswe-v1.1.json` from the live
            DeepSWE source, plus generated `data/model-mapping.json` entries
            for any new models from known vendors. Review the diff against the
            [changelog](https://deepswe.datacurve.ai/changelog) before merging;
            if costs shifted, re-check the site bundle's cost adjustment
            factors per the spec's version-bump workflow.


            ${{ steps.refresh.outputs.summary }}

  refresh-openrouter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: voidzero-dev/setup-vp@v1.17.0
        with: { cache: true }
      - run: vp run refresh:openrouter
        id: refresh
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.REFRESH_PR_TOKEN }}
          branch: refresh/openrouter
          add-paths: data/openrouter-throughput.json
          commit-message: "Refresh OpenRouter snapshot"
          title: "chore(deps): Refresh OpenRouter snapshot"
          labels: chore
          body: >
            Automated weekly refresh of `data/openrouter-throughput.json` from
            OpenRouter's model-endpoints API. The per-model value changes are
            rolling-30-minute jitter; review the model count and any warnings
            below — a disappeared model's previous value appears there, not in
            the data.


            ${{ steps.refresh.outputs.summary }}
